# Add this block to BOTH application-dev.yml and application-prod.yml
# (use a DIFFERENT secret in each — never reuse a dev secret in prod)

app:
  jwt:
    # Must be at least 32 characters (256 bits) for HS256. Generate a real one with:
    # openssl rand -base64 32
    secret: "REPLACE_WITH_A_REAL_RANDOM_32+_CHARACTER_SECRET_DO_NOT_COMMIT_THIS"
    access-token-expiry-ms: 900000   # 15 minutes
    refresh-token-expiry-ms: 604800000  # 7 days, used later when we build the refresh endpoint
