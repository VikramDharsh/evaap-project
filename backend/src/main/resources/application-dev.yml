spring:
  datasource:
    url: jdbc:mysql://localhost:3306/Phase1Demo1
    username: root
    password: "${DB_PASSWORD:root}"
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000
      max-lifetime: 1800000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  security:
    oauth2:
      redirect-uri: http://localhost:5173/auth/callback
      client:
        registration:
          google:
            client-id: 535718495729-9b345j7em2ln42bmv8hf89pjqhd5gb0i.apps.googleusercontent.com
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile

server:
  port: 8080

app:
  jwt:
    secret: "wMZTHG6t/T5sUAnIDto+CRZrAa3DZK1KpvdauF7xsq4="
    access-token-expiry-ms: 900000
    refresh-token-expiry-ms: 604800000
